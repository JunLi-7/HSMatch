# Nginx 站点配置：反向代理到 Node（Node 同时托管前端 dist + /api）
# 用法（服务器上）：
#   1) sudo cp /opt/hs-match/deploy/nginx.conf /etc/nginx/sites-available/hs-match
#   2) sudo ln -sf /etc/nginx/sites-available/hs-match /etc/nginx/sites-enabled/hs-match
#   3) （可选）删除默认站点避免抢占 80： sudo rm -f /etc/nginx/sites-enabled/default
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) 有域名后申请免费证书： sudo certbot --nginx -d 你的域名  （会自动改写为 443 + HTTPS）
server {
    listen 80;
    listen [::]:80;
    server_name _;                      # ← 先用 IP 访问保持 _；有域名后改成你的域名，如 hs-match.com

    client_max_body_size 8m;            # 放宽请求体上限（BP/赛果提交更稳）

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
