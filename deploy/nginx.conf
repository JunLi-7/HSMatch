# Nginx 站点配置（HTTPS 终结 + 反向代理到 Node）
# 用法：
#   1) 放到 /etc/nginx/sites-available/hs-match
#   2) sudo ln -s /etc/nginx/sites-available/hs-match /etc/nginx/sites-enabled/
#   3) 改 server_name 为你的域名 → sudo nginx -t && sudo systemctl reload nginx
#   4) 申请免费证书：sudo certbot --nginx -d 你的域名   （会自动把 80 改写成 443+HTTPS）
server {
    listen 80;
    server_name your-domain.com;        # ← 改成你的域名

    # 全部请求转发给 Node（Node 同时托管前端 SPA 和 /api）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
